// ---------------------------------------------------------------
// URLパラメータ（設定値をURLに埋め込む仕組み）
// ---------------------------------------------------------------
function getParam(name, defaultValue) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name) ?? defaultValue;
}

function setParam(name, value) {
  const url = new URL(window.location.href);
  url.searchParams.set(name, value);
  window.history.replaceState({}, "", url);
}

// ---------------------------------------------------------------
// 祝日の判定（祝日法のルールをそのまま実装。外部サービスを使わない）
// ---------------------------------------------------------------

// その年の春分の日・秋分の日を求める近似式（1980〜2099年で正しい）
function equinoxDay(year, isSpring) {
  const base = isSpring ? 20.8431 : 23.2488;
  return Math.floor(base + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}

// 第n月曜日の日付
function nthMonday(year, month, n) {
  const firstDow = new Date(year, month - 1, 1).getDay();
  return 1 + ((8 - firstDow) % 7) + (n - 1) * 7;
}

// その年の祝日を "月-日" の集合で返す（振替休日・国民の休日を含む）
function holidaysOf(year) {
  const days = new Set();
  const add = (m, d) => days.add(m + "-" + d);

  add(1, 1);                        // 元日
  add(1, nthMonday(year, 1, 2));    // 成人の日
  add(2, 11);                       // 建国記念の日
  add(2, 23);                       // 天皇誕生日
  add(3, equinoxDay(year, true));   // 春分の日
  add(4, 29);                       // 昭和の日
  add(5, 3);                        // 憲法記念日
  add(5, 4);                        // みどりの日
  add(5, 5);                        // こどもの日
  add(7, nthMonday(year, 7, 3));    // 海の日
  add(8, 11);                       // 山の日
  add(9, nthMonday(year, 9, 3));    // 敬老の日
  add(9, equinoxDay(year, false));  // 秋分の日
  add(10, nthMonday(year, 10, 2));  // スポーツの日
  add(11, 3);                       // 文化の日
  add(11, 23);                      // 勤労感謝の日

  const isHoliday = (date) => days.has((date.getMonth() + 1) + "-" + date.getDate());

  // 国民の休日：前後を祝日に挟まれた平日（敬老の日と秋分の日の間で起きることがある）
  const sandwiched = [];
  for (const key of days) {
    const [m, d] = key.split("-").map(Number);
    const next = new Date(year, m - 1, d + 1);
    const afterNext = new Date(year, m - 1, d + 2);
    if (next.getDay() !== 0 && !isHoliday(next) && isHoliday(afterNext)) {
      sandwiched.push(next);
    }
  }
  sandwiched.forEach(date => add(date.getMonth() + 1, date.getDate()));

  // 振替休日：祝日が日曜のとき、その後の最初の平日を休みにする
  const substitutes = [];
  for (const key of days) {
    const [m, d] = key.split("-").map(Number);
    if (new Date(year, m - 1, d).getDay() !== 0) continue;
    const next = new Date(year, m - 1, d + 1);
    while (isHoliday(next)) next.setDate(next.getDate() + 1);
    substitutes.push(next);
  }
  substitutes.forEach(date => add(date.getMonth() + 1, date.getDate()));

  return days;
}

// 土日祝なら true（＝土・日・休日ダイヤを使う）
function isHolidayDiagram(date) {
  const dow = date.getDay();
  if (dow === 0 || dow === 6) return true;
  return holidaysOf(date.getFullYear()).has((date.getMonth() + 1) + "-" + date.getDate());
}

// ---------------------------------------------------------------
// 時刻表の展開と検索
// ---------------------------------------------------------------

function toMinutes(text) {
  const [h, m] = text.split(":").map(Number);
  return h * 60 + m;
}

// "5:16>5:18 5:26>5:28" → [{ dep: 316, arr: 318 }, ...]
function parsePairs(text) {
  return text.split(/\s+/).filter(Boolean).map(pair => {
    const [dep, arr] = pair.split(">");
    return { dep: toMinutes(dep), arr: toMinutes(arr) };
  });
}

// その日・その向きについて、最初の電車ごとに「乗換後に最初に乗れる電車」を組み合わせる
function journeys(direction, diagram, transfer) {
  const table = TIMETABLE[direction];
  const firstLegs = parsePairs(table.first[diagram]);
  const secondLegs = parsePairs(table.second[diagram]);
  return firstLegs.flatMap(f => {
    const s = secondLegs.find(t => t.dep >= f.arr + transfer);
    return s ? [{ dep: f.dep, arrTransfer: f.arr, dep2: s.dep, arr: s.arr }] : [];
  });
}

// 同じ着時刻になる組み合わせは、いちばん遅く出発できるものだけ残す
function dedupeByArrival(list) {
  const result = [];
  for (const j of list) {
    if (result.length > 0 && result[result.length - 1].arr === j.arr) {
      result[result.length - 1] = j;
    } else {
      result.push(j);
    }
  }
  return result;
}

function formatTime(minutes) {
  const h = Math.floor(minutes / 60) % 24;
  const m = minutes % 60;
  return h + ":" + String(m).padStart(2, "0");
}

// ---------------------------------------------------------------
// 画面の組み立て
// ---------------------------------------------------------------
function show(direction, now = new Date()) {
  setParam("from", direction);

  document.getElementById("btn-home").classList.toggle("active", direction === "home");
  document.getElementById("btn-work").classList.toggle("active", direction === "work");

  const route = ROUTE[direction];
  const walk = Number(getParam(route.walkParam, route.defaultWalk));
  const transfer = Number(getParam("transfer", 5));

  // 深夜0〜3時台は「前日のダイヤの続き」として扱う（時刻表も 24:xx で書いてある）
  let nowMinutes = now.getHours() * 60 + now.getMinutes();
  let diagramDate = now;
  if (now.getHours() < 4) {
    nowMinutes += 24 * 60;
    diagramDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  }
  const diagram = isHolidayDiagram(diagramDate) ? "holiday" : "weekday";
  const earliest = nowMinutes + walk;

  const all = journeys(direction, diagram, transfer);
  const candidates = dedupeByArrival(all.filter(j => j.dep >= earliest)).slice(0, 3);

  // 急げば間に合うかもしれない組み合わせ：
  // 歩いては間に合わないが徒歩時間の半分以上は残っていて、しかも1番目の候補より早く着くもののうち、いちばん遅く出るもの
  const firstArr = candidates.length > 0 ? candidates[0].arr : Infinity;
  const rushable = all.filter(j =>
    j.dep < earliest && j.dep - nowMinutes >= walk / 2 && j.arr < firstArr);
  const rush = rushable.length > 0 ? rushable[rushable.length - 1] : null;

  const result = document.getElementById("result");

  const header = `<p class="route">${route.from}から徒歩${walk}分 → ${route.first.station}
    ─${route.first.line}─ ${route.transfer}（乗換${transfer}分）─${route.second.line}─ ${route.last}
    　${diagram === "holiday" ? "土・日・休日" : "平日"}ダイヤ</p>`;

  const describe = (j) =>
    `${route.first.station} ${formatTime(j.dep)} 発 → ${route.last} ${formatTime(j.arr)} 着
     <span class="via">（${route.transfer} ${formatTime(j.dep2)} ${route.second.line}発）</span>`;

  const rushBlock = rush ? `
    <div class="rush">
      <span class="rush-label">急げば</span>
      ${describe(rush)}
      <span class="rush-note">${rush.dep - nowMinutes}分で${route.first.station}に着ければ間に合う（徒歩${walk}分）</span>
    </div>` : "";

  if (candidates.length === 0) {
    result.innerHTML = header + rushBlock +
      `<div class="empty">今日の電車は終わりです。</div>`;
    return;
  }

  const [first, ...rest] = candidates;
  const firstLeave = first.dep - walk - nowMinutes;

  const primary = `
    <div class="primary">
      <div class="leave">${firstLeave === 0 ? "今すぐ" : "あと " + firstLeave}<span class="unit">${firstLeave === 0 ? " 出発" : " 分で出発"}</span></div>
      <div class="detail">${describe(first)}</div>
    </div>`;

  const others = rest.map(j => {
    const leave = j.dep - walk - nowMinutes;
    return `<div>あと ${leave} 分　${describe(j)}</div>`;
  }).join("");

  result.innerHTML = header + rushBlock + primary + `<div class="others">${others}</div>`;
}

window.addEventListener("DOMContentLoaded", () => {
  show(getParam("from", "home"));
});
